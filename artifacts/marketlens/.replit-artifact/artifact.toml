kind = "web"
previewPath = "/"
title = "MarketLens"
description = "Research any product, service, or business idea with source-linked competitors, customer needs, market signals, and transparent profitability scenarios."
version = "1.0.0"
id = "artifacts/marketlens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24915

[services.development]
run = "pnpm --filter @workspace/marketlens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketlens", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketlens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24915"
BASE_PATH = "/"
